# config/config.yaml
# Default hyper-parameters for the mini end-to-end pipeline.

# ------------------------------------------------------------------
# Data
# ------------------------------------------------------------------
dataset_size: 4000          # total samples generated synthetically
train_split: 0.8            # 80 % train, 20 % validation
data_seed: 0               # makes the dataset deterministic

# ------------------------------------------------------------------
# Optimiser & schedule
# ------------------------------------------------------------------
lr: 0.01
weight_decay: 1e-4
batch_size: 64
epochs: 50
print_every: 10